name = "day-sheet-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-02"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"

[[kv_namespaces]]
binding = "DAY_SHEET_KV"
id = "f02d047a1e6b4cfeab61cd5e261effb0"

[triggers]
# Fires hourly (UTC) — the scheduled() handler in src/index.js then checks
# the current Sydney-local hour and only actually pulls from Rentman at
# 8am/11am/2pm/5pm (REFRESH_HOURS), so refreshes stay within business hours
# without a DST-fragile UTC-only cron expression trying to encode that
# directly. See CLAUDE.md "Live schedule refresh (Cron Trigger)". Requires
# the RENTMAN_API_TOKEN secret to be set (Cloudflare dashboard or
# `wrangler secret put`) — that can't be done from Claude's sandbox, see
# CLAUDE.md for why.
crons = ["0 * * * *"]
