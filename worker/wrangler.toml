name = "day-sheet-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-02"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"

[[kv_namespaces]]
binding = "DAY_SHEET_KV"
id = "f02d047a1e6b4cfeab61cd5e261effb0"

[triggers]
# Every 3 hours — refreshes the baked-nowhere-anymore Rentman schedule via
# the Worker's own scheduled() handler, writing to DAY_SHEET_KV. See
# CLAUDE.md "Live schedule refresh (Cron Trigger)". Requires the
# RENTMAN_API_TOKEN secret to be set (Cloudflare dashboard or
# `wrangler secret put`) — that can't be done from Claude's sandbox, see
# CLAUDE.md for why.
crons = ["0 */3 * * *"]
