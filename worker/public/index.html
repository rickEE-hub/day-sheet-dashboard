<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --surface-2:#EEF1F5;
    --ink:#171B21;
    --ink-dim:#5B6472;
    --ink-faint:#94A0AF;
    --border:#E3E7ED;
    --border-strong:#C9D0DA;
    --accent:#2454E8;
    --accent-ink:#FFFFFF;
    --accent-soft:#E4EBFD;
    --cat-install:#2454E8;
    --cat-install-soft:#E4EBFD;
    --cat-packdown:#7B3FE4;
    --cat-packdown-soft:#EEE5FD;
    --cat-delivery:#0E9F6E;
    --cat-delivery-soft:#DCF7EC;
    --cat-collection:#DD6B20;
    --cat-collection-soft:#FDE9D8;
    --cat-driver:#0891B2;
    --cat-driver-soft:#DBF4F9;
    --cat-test:#DB2777;
    --cat-test-soft:#FBE1EC;
    --cat-other:#6B7280;
    --cat-other-soft:#EBEDF0;
    --vehicle:#1E3A5F;
    --vehicle-soft:#E1E9F1;
    --vehicle-ink:#1E3A5F;
    --status-confirmed:#0E9F6E;
    --status-confirmed-soft:#DCF7EC;
    --status-pending:#B45309;
    --status-pending-soft:#FDECD3;
    --status-prepped:#7B3FE4;
    --status-prepped-soft:#EEE5FD;
    --status-onlocation:#2454E8;
    --status-onlocation-soft:#E4EBFD;
    --status-returned:#6B7280;
    --status-returned-soft:#EBEDF0;
    --warn:#C2410C;
    --warn-soft:#FDE7DA;
    --reminder-bg-a:#FFF7ED;
    --reminder-bg-b:#FFEFD9;
    --reminder-border:#F3C98B;
    --reminder-ink:#7C4A12;
    --reminder-label:#9A5B0F;
    --shadow: 0 1px 2px rgba(20,25,35,.04), 0 8px 24px rgba(20,25,35,.06);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161C;
      --surface:#1B212B;
      --surface-2:#232A35;
      --ink:#EDEFF3;
      --ink-dim:#9AA3B2;
      --ink-faint:#6B7484;
      --border:#2A313D;
      --border-strong:#3A4250;
      --accent:#6B93F7;
      --accent-ink:#0B1220;
      --accent-soft:#1E2A4A;
      --cat-install:#6B93F7;
      --cat-install-soft:#1E2A4A;
      --cat-packdown:#B49CFB;
      --cat-packdown-soft:#2C2350;
      --cat-delivery:#3EDCA0;
      --cat-delivery-soft:#123528;
      --cat-collection:#FB923C;
      --cat-collection-soft:#3A2411;
      --cat-driver:#3FD0E8;
      --cat-driver-soft:#0E323A;
      --cat-test:#F472B6;
      --cat-test-soft:#3A1C2C;
      --cat-other:#9CA3AF;
      --cat-other-soft:#262B33;
      --vehicle:#9CC0F0;
      --vehicle-soft:#1E2A3D;
      --vehicle-ink:#BFD9F5;
      --status-confirmed:#3EDCA0;
      --status-confirmed-soft:#123528;
      --status-pending:#FBBF6D;
      --status-pending-soft:#3A2A11;
      --status-prepped:#B49CFB;
      --status-prepped-soft:#2C2350;
      --status-onlocation:#6B93F7;
      --status-onlocation-soft:#1E2A4A;
      --status-returned:#9CA3AF;
      --status-returned-soft:#262B33;
      --warn:#FB923C;
      --warn-soft:#3A2411;
      --reminder-bg-a:#2A2013;
      --reminder-bg-b:#332616;
      --reminder-border:#5A431F;
      --reminder-ink:#F0C989;
      --reminder-label:#F3B85E;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161C;
    --surface:#1B212B;
    --surface-2:#232A35;
    --ink:#EDEFF3;
    --ink-dim:#9AA3B2;
    --ink-faint:#6B7484;
    --border:#2A313D;
    --border-strong:#3A4250;
    --accent:#6B93F7;
    --accent-ink:#0B1220;
    --accent-soft:#1E2A4A;
    --cat-install:#6B93F7;
    --cat-install-soft:#1E2A4A;
    --cat-packdown:#B49CFB;
    --cat-packdown-soft:#2C2350;
    --cat-delivery:#3EDCA0;
    --cat-delivery-soft:#123528;
    --cat-collection:#FB923C;
    --cat-collection-soft:#3A2411;
    --cat-driver:#3FD0E8;
    --cat-driver-soft:#0E323A;
    --cat-test:#F472B6;
    --cat-test-soft:#3A1C2C;
    --cat-other:#9CA3AF;
    --cat-other-soft:#262B33;
    --vehicle:#9CC0F0;
    --vehicle-soft:#1E2A3D;
    --vehicle-ink:#BFD9F5;
    --status-confirmed:#3EDCA0;
    --status-confirmed-soft:#123528;
    --status-pending:#FBBF6D;
    --status-pending-soft:#3A2A11;
    --status-prepped:#B49CFB;
    --status-prepped-soft:#2C2350;
    --status-onlocation:#6B93F7;
    --status-onlocation-soft:#1E2A4A;
    --status-returned:#9CA3AF;
    --status-returned-soft:#262B33;
    --warn:#FB923C;
    --warn-soft:#3A2411;
    --reminder-bg-a:#2A2013;
    --reminder-bg-b:#332616;
    --reminder-border:#5A431F;
    --reminder-ink:#F0C989;
    --reminder-label:#F3B85E;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* ---- Reminder banner ---- */
  .reminder{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:linear-gradient(135deg,var(--reminder-bg-a),var(--reminder-bg-b));
    border:1px solid var(--reminder-border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .reminder .reminder-ico{font-size:18px; line-height:1.3;}
  .reminder .reminder-txt{font-size:13.5px; color:var(--reminder-ink); flex:1; min-width:0; overflow-wrap:anywhere; white-space:pre-wrap;}
  .reminder .reminder-txt b{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; color:var(--reminder-label); font-weight:700;}
  .reminder-actions{display:flex; gap:6px; flex:none;}
  .reminder-add-btn{
    display:block;
    background:none;
    border:1px dashed var(--border-strong);
    color:var(--ink-faint);
    border-radius:var(--radius);
    padding:9px 14px;
    font-size:12.5px;
    cursor:pointer;
    margin-bottom:20px;
    width:100%;
    text-align:left;
  }
  .reminder-add-btn:hover{color:var(--ink-dim); border-color:var(--ink-faint);}
  .reminder-edit{align-items:stretch;}
  .reminder-edit-body{flex:1; min-width:0;}
  .reminder-edit-body textarea{
    width:100%;
    font-family:inherit;
    font-size:13.5px;
    padding:8px 9px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    resize:vertical;
    min-height:60px;
  }
  .reminder-edit-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:8px;}

  /* ---- Header / masthead ---- */
  .masthead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .masthead-left{display:flex; flex-direction:column; gap:3px;}
  .eyebrow{
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
  }
  h1{
    font-weight:800;
    letter-spacing:-.02em;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    text-wrap:balance;
  }
  .date-line{
    font-size:14px;
    color:var(--ink-dim);
    font-weight:500;
  }
  .masthead-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .snapshot-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:100px;
    background:var(--surface-2);
    color:var(--ink-dim);
    border:1px solid var(--border);
    white-space:nowrap;
  }
  .button-row{display:flex; gap:8px;}
  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    border-radius:9px;
    padding:8px 14px;
    cursor:pointer;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn.primary{background:var(--accent); color:var(--accent-ink); border:none;}
  .btn.primary:hover{filter:brightness(1.06); color:var(--accent-ink);}

  .save-flag{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    margin:0;
    min-height:14px;
    text-align:right;
  }
  .save-flag.err{color:var(--warn);}

  .form-card{
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .form-for{
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:12px;
  }
  .form-for strong{color:var(--ink);}
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 12px;
  }
  .form-grid .full{grid-column:1/-1;}
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-faint);
    margin-bottom:4px;
    font-weight:600;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:inherit;
    font-size:13.5px;
    padding:8px 9px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:104px;}
  .form-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
  }
  .btn-secondary{
    background:none;
    border:1px solid var(--border-strong);
    color:var(--ink-dim);
    border-radius:9px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-secondary:hover{border-color:var(--ink-faint); color:var(--ink);}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:9px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled, .btn-secondary:disabled{opacity:.6; cursor:default;}

  /* ---- Day tabs ---- */
  .day-tabs{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .day-tab{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 6px;
    text-align:center;
    cursor:pointer;
  }
  .day-tab .wd{display:block; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--ink-dim);}
  .day-tab .num{display:block; font-size:17px; font-weight:800; margin-top:2px; color:var(--ink);}
  .day-tab:hover{border-color:var(--border-strong);}
  .day-tab.active{background:var(--accent); border-color:var(--accent);}
  .day-tab.active .wd, .day-tab.active .num{color:var(--accent-ink);}

  /* ---- Legend ---- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    padding:0 0 20px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .legend-item{display:inline-flex; align-items:center; gap:6px;}
  .legend-swatch{width:9px;height:9px;border-radius:3px;flex:none;}

  /* ---- Top-level states ---- */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
  }
  .empty-state .big{font-size:19px; font-weight:700; color:var(--ink); margin-bottom:6px;}

  /* ---- Timeline (jobs + manual items, interleaved by time) ---- */
  .groups{display:flex; flex-direction:column; gap:14px; margin-top:0;}

  .job, .manual-item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .manual-item{border:1px dashed var(--border-strong);}
  .job-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .job-title-block{min-width:0;}
  .job-title{
    font-weight:700;
    font-size:17px;
    letter-spacing:.01em;
    margin:0;
    overflow-wrap:anywhere;
  }
  .job-sub{
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:2px;
    display:flex;
    flex-wrap:wrap;
    gap:4px 10px;
  }
  .job-badges{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

  .pill{
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:100px;
    white-space:nowrap;
  }
  .pill-confirmed{background:var(--status-confirmed-soft); color:var(--status-confirmed);}
  .pill-pending{background:var(--status-pending-soft); color:var(--status-pending);}
  .pill-prepped{background:var(--status-prepped-soft); color:var(--status-prepped);}
  .pill-onlocation{background:var(--status-onlocation-soft); color:var(--status-onlocation);}
  .pill-returned{background:var(--status-returned-soft); color:var(--status-returned);}
  .pill-warn{background:var(--warn-soft); color:var(--warn);}

  .rows{display:flex; flex-direction:column;}
  .row{
    display:grid;
    grid-template-columns:80px 116px 1fr;
    gap:12px;
    padding:13px 18px;
    border-top:1px solid var(--border);
    align-items:start;
  }
  .rows .row:first-child{border-top:none;}
  .manual-item .row{padding:14px 18px;}
  .row-time{
    font-family:'JetBrains Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    padding-top:2px;
    white-space:nowrap;
  }
  .row-time .end{color:var(--ink-faint); display:block; font-size:11px; font-weight:500; margin-top:1px;}
  .cat-chip{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:7px;
    display:inline-block;
    white-space:nowrap;
    width:fit-content;
  }
  .cat-install{background:var(--cat-install-soft); color:var(--cat-install);}
  .cat-packdown{background:var(--cat-packdown-soft); color:var(--cat-packdown);}
  .cat-delivery{background:var(--cat-delivery-soft); color:var(--cat-delivery);}
  .cat-collection{background:var(--cat-collection-soft); color:var(--cat-collection);}
  .cat-driver{background:var(--cat-driver-soft); color:var(--cat-driver);}
  .cat-test{background:var(--cat-test-soft); color:var(--cat-test);}
  .cat-other{background:var(--cat-other-soft); color:var(--cat-other);}

  .row-body{min-width:0;}
  .row-body-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .fn-name{font-weight:600; font-size:14.5px;}
  .crew-line{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .crew-chip{
    font-size:12px;
    background:var(--surface-2);
    color:var(--ink);
    padding:3px 9px;
    border-radius:100px;
    font-weight:500;
  }
  .crew-unassigned{
    font-size:12px;
    color:var(--warn);
    font-weight:600;
  }
  .vehicle-line{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    align-items:center;
  }
  .vehicle-tag{
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--vehicle);
    font-weight:700;
  }
  .vehicle-chip{
    font-size:12px;
    background:var(--vehicle-soft);
    color:var(--vehicle-ink);
    padding:3px 10px;
    border-radius:7px;
    font-weight:600;
    border:1px solid var(--vehicle-soft);
  }
  .vehicle-missing{
    font-size:12px;
    color:var(--warn);
    font-weight:600;
  }
  .row-note{
    margin-top:7px;
    font-size:12.5px;
    color:var(--ink-dim);
    background:var(--surface-2);
    border-radius:8px;
    padding:8px 10px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .row-note-text{flex:1; min-width:0;}
  .note-link{
    background:none;
    border:none;
    color:var(--accent);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    flex:none;
  }
  .note-link:hover{text-decoration:underline;}
  .note-link.add{
    margin-top:7px;
    color:var(--ink-faint);
    border:1px dashed var(--border-strong);
    border-radius:7px;
    padding:5px 9px;
    display:inline-block;
  }
  .note-link.add:hover{color:var(--ink-dim); border-color:var(--ink-faint); text-decoration:none;}
  .note-edit{margin-top:7px;}
  .note-edit textarea{
    width:100%;
    font-family:inherit;
    font-size:12.5px;
    padding:8px 9px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    resize:vertical;
    min-height:96px;
  }
  .note-edit-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .no-tasks{
    padding:14px 18px;
    font-size:13px;
    color:var(--ink-faint);
    font-style:italic;
  }

  .manual-actions{display:flex; gap:6px; flex:none;}
  .icon-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--ink-dim);
    border-radius:7px;
    width:26px;height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:13px;
    flex:none;
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}

  footer{
    margin-top:40px;
    padding-top:14px;
    border-top:1px solid var(--border);
    font-size:11.5px;
    color:var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  [hidden]{display:none !important;}

  @media (max-width:640px){
    .day-tabs{grid-template-columns:repeat(3,1fr); }
    .row{grid-template-columns:64px 1fr; }
    .row .cat-chip{grid-column:2; }
    .row-time{grid-row:1/3;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div id="reminder-slot"></div>

  <header class="masthead">
    <div class="masthead-left">
      <div class="eyebrow">Event Equipment Group &middot; NSW Warehouse Ops &middot; Shared &amp; editable</div>
      <h1>Day Sheet</h1>
      <div class="date-line" id="date-line">&nbsp;</div>
    </div>
    <div class="masthead-right">
      <span class="snapshot-badge" id="snapshot-label">snapshot: &mdash;</span>
      <div class="button-row">
        <button class="btn primary" id="add-item-btn" type="button" hidden>+ Add item</button>
        <button class="btn" id="lock-btn" type="button">Unlock editing</button>

<script id="app-script">
(function(){
  "use strict";

  var STATUS_LIST = [
    {id:1, key:'pending',    label:'Pending'},
    {id:3, key:'confirmed',  label:'Confirmed'},
    {id:4, key:'prepped',    label:'Prepped'},
    {id:5, key:'onlocation', label:'On location'},
    {id:6, key:'returned',   label:'Returned'}
  ];
  var STATUS_META = {};
  STATUS_LIST.forEach(function(s){ STATUS_META[s.key] = s; });

  var DAY_OFFSETS = [0, 1, 2, 3, 4];

  var els = {
    dateLine: document.getElementById('date-line'),
    groups: document.getElementById('groups'),
    footerCount: document.getElementById('footer-count'),
    dayTabs: document.getElementById('day-tabs'),
    snapshotLabel: document.getElementById('snapshot-label'),
    reloadBtn: document.getElementById('reload-btn'),
    addItemBtn: document.getElementById('add-item-btn'),
    lockBtn: document.getElementById('lock-btn'),
    formSlot: document.getElementById('form-slot'),
    saveFlag: document.getElementById('save-flag'),
    reminderSlot: document.getElementById('reminder-slot')
  };

  var API_BASE = '/api/items';
  var NOTES_API = '/api/notes';
  var REMINDER_API = '/api/reminder';
  var PASSCODE = '4242';
  var PASSCODE_STORAGE_KEY = 'ds-passcode';
  var UNLOCKED = false;
  var selectedDayOffset = 0;
  var dayCache = {0:[], 1:[], 2:[], 3:[], 4:[]};
  var lastUpdated = null;
  var manualItems = [];
  var editingItemId = null;
  var liveNotes = {};
  var noteEditingId = null;
  var reminderText = '';
  var reminderEditing = false;
  var pollTimer = null;

  /* ------------------------- helpers: dates ------------------------- */

  function sydneyParts(date){
    var fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone:'Australia/Sydney', year:'numeric', month:'2-digit', day:'2-digit'
    });
    var s = fmt.format(date); // YYYY-MM-DD
    var bits = s.split('-');
    return {y:+bits[0], m:+bits[1], d:+bits[2]};
  }

  function sydneyOffsetMs(date){
    var fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'Australia/Sydney', timeZoneName:'shortOffset', hour:'2-digit'
    });
    var parts = fmt.formatToParts(date);
    var tzPart = parts.find(function(p){ return p.type === 'timeZoneName'; });
    var m = tzPart && tzPart.value.match(/GMT([+-]\d+)(?::?(\d+))?/);
    if(!m) return 10 * 3600 * 1000;
    var h = parseInt(m[1], 10);
    var min = m[2] ? parseInt(m[2], 10) : 0;
    return (h * 3600 + (h < 0 ? -min : min) * 60) * 1000;
  }

  // Returns [dayStart, dayEnd) as real Date instants for the Sydney
  // calendar day `offsetDays` from today (0 = today, 1 = tomorrow, ...),
  // computed without assuming the viewer's own timezone.
  function sydneyDayRange(offsetDays){
    var now = new Date();
    var p = sydneyParts(now);
    var guessUTC = Date.UTC(p.y, p.m - 1, p.d + offsetDays, 0, 0, 0);
    var offsetMs = sydneyOffsetMs(new Date(guessUTC));
    var start = new Date(guessUTC - offsetMs);
    var end = new Date(start.getTime() + 24 * 3600 * 1000);
    return {start:start, end:end};
  }

  function isoDateForOffset(offsetDays){
    var range = sydneyDayRange(offsetDays);
    var fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone:'Australia/Sydney', year:'numeric', month:'2-digit', day:'2-digit'
    });
    return fmt.format(range.start);
  }

  function fmtDateLineFor(date){
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', weekday:'long', day:'numeric', month:'long', year:'numeric'
    });
    return fmt.format(date);
  }

  function fmtWeekdayTitleFor(date){
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', weekday:'long'
    });
    return fmt.format(date).toUpperCase();
  }

  function fmtDayNumberFor(date){
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', day:'numeric'
    });
    return fmt.format(date);
  }

  function fmtSnapshotDateTime(date){
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', weekday:'short', day:'numeric', month:'short',
      year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false
    });
    return fmt.format(date) + ' AEST/AEDT';
  }

  function fmtFullDateFromISO(iso){
    var bits = (iso || '').split('-');
    if(bits.length !== 3) return '';
    var d = new Date(Date.UTC(+bits[0], +bits[1]-1, +bits[2], 12, 0, 0));
    var fmt = new Intl.DateTimeFormat('en-AU', {weekday:'long', day:'numeric', month:'long'});
    return fmt.format(d);
  }

  function fmtTime(iso){
    if(!iso) return null;
    var d = new Date(iso);
    if(isNaN(d)) return null;
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', hour:'2-digit', minute:'2-digit', hour12:false
    });
    return fmt.format(d);
  }

  function timeToMinutes(hhmm){
    if(!hhmm) return null;
    var bits = hhmm.split(':');
    if(bits.length !== 2) return null;
    var n = (+bits[0]) * 60 + (+bits[1]);
    return isNaN(n) ? null : n;
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ------------------------- classification (kept for parity with the
   * live source — categories arrive pre-computed in the baked-in data,
   * but this mirrors the exact logic that produced them). ------------------------- */

  function classify(name){
    var n = (name || '').toLowerCase();
    var has = function(arr){ return arr.some(function(k){ return n.indexOf(k) !== -1; }); };
    var testKw = ['test'];
    var driverKw = ['driver'];
    var deliveryKw = ['delivery','deliver'];
    var collectionKw = ['collection','pickup','pick up','pick-up','return'];
    var packdownKw = ['packdown','pack down','pack-down','bump out','bump-out','bumpout','strike','de-rig','derig','teardown','dismantle'];
    var installKw = ['setup','set up','set-up','install','bump in','bump-in','bumpin','build up','build-up','rig'];
    if(has(testKw)) return 'test';
    if(has(driverKw)) return 'driver';
    if(has(deliveryKw)) return 'delivery';
    if(has(collectionKw)) return 'collection';
    if(has(packdownKw)) return 'packdown';
    if(has(installKw)) return 'install';
    return 'other';
  }

  var CAT_LABEL = {
    install:'Install', packdown:'Pack down', delivery:'Delivery',
    collection:'Collection', driver:'Driver', test:'Test', other:'Other'
  };

  /* ------------------------- state (baked-in snapshot) ------------------------- */

  function getState(){
    try{
      var raw = document.getElementById('app-state').textContent;
      var parsed = JSON.parse(raw);
      if(!parsed.items) parsed.items = [];
      if(!parsed.notes) parsed.notes = {};
      if(!parsed.schedule) parsed.schedule = {updatedAt:null, days:{}};
      return parsed;
    }catch(e){
      return {items:[], notes:{}, schedule:{updatedAt:null, days:{}}};
    }
  }

  // This is a static build: the schedule was fetched once at build time
  // and baked into the #app-state script tag below. There is no network
  // call here — every viewer just reads the same embedded snapshot.
  function loadScheduleFromState(){
    var state = getState();
    var sched = state.schedule || {updatedAt:null, days:{}};
    var nextCache = {};
    DAY_OFFSETS.forEach(function(off){
      var iso = isoDateForOffset(off);
      nextCache[off] = (sched.days && sched.days[iso]) || [];
    });
    dayCache = nextCache;
    lastUpdated = sched.updatedAt ? new Date(sched.updatedAt) : null;
  }

  function renderSnapshotLabel(){
    els.snapshotLabel.textContent = lastUpdated
      ? ('Snapshot generated ' + fmtSnapshotDateTime(lastUpdated))
      : 'Snapshot not yet generated';
  }

  /* ------------------------- day tabs ------------------------- */

  function updateDayTabs(){
    els.dayTabs.querySelectorAll('.day-tab').forEach(function(btn){
      var offset = parseInt(btn.getAttribute('data-offset'), 10);
      var range = sydneyDayRange(offset);
      var wd = btn.querySelector('.wd');
      var num = btn.querySelector('.num');
      if(wd) wd.textContent = fmtWeekdayTitleFor(range.start);
      if(num) num.textContent = fmtDayNumberFor(range.start);
      var isActive = offset === selectedDayOffset;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  }

  /* ------------------------- reminder banner ------------------------- */

  function reminderHtml(){
    if(reminderEditing){
      return (
        '<div class="reminder reminder-edit">' +
          '<span class="reminder-ico">&#128204;</span>' +
          '<div class="reminder-edit-body">' +
            '<textarea id="reminder-ta" maxlength="2000" rows="3" placeholder="e.g. Forklift #2 is due for its annual safety inspection this Friday">' + escapeHtml(reminderText) + '</textarea>' +
            '<div class="reminder-edit-actions">' +
              '<button class="btn-secondary" type="button" id="reminder-cancel">Cancel</button>' +
              '<button class="btn-primary" type="button" id="reminder-save">Save reminder</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }
    if(reminderText){
      return (
        '<div class="reminder">' +
          '<span class="reminder-ico">&#128204;</span>' +
          '<div class="reminder-txt"><b>Reminder</b>' + escapeHtml(reminderText) + '</div>' +
          (UNLOCKED
            ? '<div class="reminder-actions">' +
                '<button class="icon-btn" type="button" id="reminder-edit-btn" title="Edit reminder" aria-label="Edit reminder">&#9998;</button>' +
                '<button class="icon-btn" type="button" id="reminder-clear-btn" title="Clear reminder" aria-label="Clear reminder">&times;</button>' +
              '</div>'
            : '') +
        '</div>'
      );
    }
    if(UNLOCKED){
      return '<button class="reminder-add-btn" type="button" id="reminder-add-btn">+ Add reminder</button>';
    }
    return '';
  }

  function renderReminder(){
    els.reminderSlot.innerHTML = reminderHtml();
    wireReminderActions();
  }

  function wireReminderActions(){
    var addBtn = document.getElementById('reminder-add-btn');
    if(addBtn) addBtn.addEventListener('click', function(){
      if(!UNLOCKED){ promptUnlock(); return; }
      reminderEditing = true;
      renderReminder();
    });
    var editBtn = document.getElementById('reminder-edit-btn');
    if(editBtn) editBtn.addEventListener('click', function(){ reminderEditing = true; renderReminder(); });
    var clearBtn = document.getElementById('reminder-clear-btn');
    if(clearBtn) clearBtn.addEventListener('click', function(){
      if(!window.confirm('Clear the reminder banner for everyone with this link?')) return;
      putReminder('');
    });
    var cancelBtn = document.getElementById('reminder-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){ reminderEditing = false; renderReminder(); });
    var saveBtn = document.getElementById('reminder-save');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var ta = document.getElementById('reminder-ta');
      putReminder(ta ? ta.value.trim() : '');
    });
  }

  function putReminder(text){
    var saveBtn = document.getElementById('reminder-save');
    if(saveBtn) saveBtn.disabled = true;
    return fetch(REMINDER_API, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json', 'x-day-sheet-passcode': PASSCODE},
      body: JSON.stringify({text: text})
    })
      .then(function(res){
        if(res.status === 401){
          lockEditing();
          flagSave('Editing was locked — click Unlock editing and try again.', true);
          throw null;
        }
        if(!res.ok) throw new Error('save failed');
        return res.json();
      })
      .then(function(data){
        reminderText = (data && data.text) || '';
        reminderEditing = false;
        renderReminder();
        flagSave(reminderText ? 'Reminder saved.' : 'Reminder cleared.', false);
      })
      .catch(function(err){
        if(err) flagSave('Couldn’t save reminder — check your connection and try again.', true);
        if(saveBtn) saveBtn.disabled = false;
      });
  }

  function fetchReminder(){
    return fetch(REMINDER_API)
      .then(function(res){
        if(!res.ok) throw new Error('load failed');
        return res.json();
      })
      .then(function(data){
        reminderText = (data && data.text) || '';
        renderReminder();
      })
      .catch(function(){ /* keep last known */ });
  }

  /* ------------------------- rendering: unified timeline ------------------------- */

  function renderCurrentDay(){
    updateDayTabs();

    var range = sydneyDayRange(selectedDayOffset);
    els.dateLine.textContent = fmtDateLineFor(range.start);

    var jobs = dayCache[selectedDayOffset] || [];
    var iso = isoDateForOffset(selectedDayOffset);
    var itemsForDay = manualItems.filter(function(i){
      return (i.date || isoDateForOffset(0)) === iso;
    });

    var entries = jobs.map(function(job){
      var mins = job.rows.length ? timeToMinutes(fmtTime(job.rows[0].start)) : null;
      return {type:'job', sortKey: mins == null ? Infinity : mins, html: jobCardHtml(job)};
    }).concat(itemsForDay.map(function(item){
      var mins = timeToMinutes(item.start);
      return {type:'manual', sortKey: mins == null ? Infinity : mins, html: manualCardHtml(item)};
    }));

    entries.sort(function(a,b){ return a.sortKey - b.sortKey; });

    els.footerCount.textContent = (jobs.length || itemsForDay.length)
      ? (jobs.length + ' job' + (jobs.length === 1 ? '' : 's') + (itemsForDay.length ? ', ' + itemsForDay.length + ' manual' : ''))
      : '';

    if(!entries.length){
      els.groups.innerHTML =
        '<div class="empty-state">' +
          '<div class="big">Nothing scheduled</div>' +
          '<div>No jobs or manual items for ' + escapeHtml(fmtWeekdayTitleFor(range.start)) + '. Use “+ Add item” to add something.</div>' +
        '</div>';
      wireRowActions();
      return;
    }

    els.groups.innerHTML = entries.map(function(e){ return e.html; }).join('');
    wireRowActions();
  }

  function wireRowActions(){
    els.groups.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ openForm(btn.getAttribute('data-edit')); });
    });
    els.groups.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteItem(btn.getAttribute('data-del')); });
    });
    els.groups.querySelectorAll('[data-note-open]').forEach(function(btn){
      btn.addEventListener('click', function(){
        noteEditingId = btn.getAttribute('data-note-open');
        renderCurrentDay();
      });
    });
    els.groups.querySelectorAll('[data-note-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(){ noteEditingId = null; renderCurrentDay(); });
    });
    els.groups.querySelectorAll('[data-note-save]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveNote(btn.getAttribute('data-note-save')); });
    });
  }

  function jobCardHtml(job){
    var meta = STATUS_META[job.status] || {key:'other', label:job.status};
    var pillClass = 'pill-' + meta.key;
    var pillLabel = meta.label;

    var rowsHtml;
    if(job.loadError){
      rowsHtml = '<div class="no-tasks">Couldn&rsquo;t load tasks for this job at build time &mdash; ' + escapeHtml(job.loadError) + '</div>';
    } else {
      rowsHtml = job.rows.map(function(row){ return renderRow(row); }).join('');
    }

    return (
      '<div class="job">' +
        '<div class="job-head">' +
          '<div class="job-title-block">' +
            '<h3 class="job-title">' + escapeHtml(job.title) + '</h3>' +
            (job.venue ? '<div class="job-sub">' + escapeHtml(job.venue) + '</div>' : '') +
          '</div>' +
          '<div class="job-badges"><span class="pill ' + pillClass + '">' + escapeHtml(pillLabel) + '</span></div>' +
        '</div>' +
        '<div class="rows">' + rowsHtml + '</div>' +
      '</div>'
    );
  }

  function noteHtmlFor(rowId){
    var id = String(rowId);
    var text = (liveNotes[id] && liveNotes[id].text) || '';
    if(noteEditingId === id){
      return (
        '<div class="note-edit">' +
          '<textarea id="note-ta-' + id + '" maxlength="4000" rows="4" placeholder="Add a note for this task">' + escapeHtml(text) + '</textarea>' +
          '<div class="note-edit-actions">' +
            '<button class="btn-secondary" type="button" data-note-cancel="' + id + '">Cancel</button>' +
            '<button class="btn-primary" type="button" data-note-save="' + id + '">Save note</button>' +
          '</div>' +
        '</div>'
      );
    }
    if(text){
      return (
        '<div class="row-note">' +
          '<span class="row-note-text">' + escapeHtml(text) + '</span>' +
          (UNLOCKED ? '<button class="note-link" type="button" data-note-open="' + id + '">Edit</button>' : '') +
        '</div>'
      );
    }
    if(UNLOCKED){
      return '<button class="note-link add" type="button" data-note-open="' + id + '">+ Add note</button>';
    }
    return '';
  }

  function renderRow(row){
    var start = fmtTime(row.start);
    var end = fmtTime(row.end);
    var crewHtml;
    if(row.crew.length){
      crewHtml = row.crew.map(function(name){
        return '<span class="crew-chip">' + escapeHtml(name) + '</span>';
      }).join('');
      if(row.needed && row.needed > row.crew.length){
        crewHtml += '<span class="crew-unassigned">' + (row.needed - row.crew.length) + ' more needed</span>';
      }
    } else {
      crewHtml = '<span class="crew-unassigned">Unassigned' + (row.needed ? ' — ' + row.needed + ' needed' : '') + '</span>';
    }

    var vehicleHtml = '<div class="vehicle-line"><span class="vehicle-tag">Vehicle</span>' +
      (row.vehicles.length
        ? row.vehicles.map(function(v){ return '<span class="vehicle-chip">' + escapeHtml(v) + '</span>'; }).join('')
        : '<span class="vehicle-missing">Not assigned</span>') +
      '</div>';

    return (
      '<div class="row">' +
        '<div class="row-time">' + (start || '—') + (end && end !== start ? '<span class="end">' + end + '</span>' : '') + '</div>' +
        '<div><span class="cat-chip cat-' + row.category + '">' + CAT_LABEL[row.category] + '</span></div>' +
        '<div class="row-body">' +
          '<div class="fn-name">' + escapeHtml(row.name) + '</div>' +
          '<div class="crew-line">' + crewHtml + '</div>' +
          vehicleHtml +
          noteHtmlFor(row.id) +
        '</div>' +
      '</div>'
    );
  }

  function manualCardHtml(item){
    var start = item.start || '';
    var end = item.end || '';
    return (
      '<div class="manual-item">' +
        '<div class="row">' +
          '<div class="row-time">' + (start || '—') + (end && end !== start ? '<span class="end">' + escapeHtml(end) + '</span>' : '') + '</div>' +
          '<div><span class="cat-chip cat-' + (item.category || 'other') + '">' + CAT_LABEL[item.category || 'other'] + '</span></div>' +
          '<div class="row-body">' +
            '<div class="row-body-head">' +
              '<div class="fn-name">' + escapeHtml(item.title || 'Untitled') + '</div>' +
              (UNLOCKED
                ? '<div class="manual-actions">' +
                    '<button class="icon-btn" type="button" data-edit="' + item.id + '" title="Edit" aria-label="Edit item">&#9998;</button>' +
                    '<button class="icon-btn" type="button" data-del="' + item.id + '" title="Delete" aria-label="Delete item">&times;</button>' +
                  '</div>'
                : '') +
            '</div>' +
            (item.crew ? '<div class="crew-line"><span class="crew-chip">' + escapeHtml(item.crew) + '</span></div>' : '') +
            (item.note ? '<div class="row-note"><span class="row-note-text">' + escapeHtml(item.note) + '</span></div>' : '') +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* ------------------------- manual items: shared via /api/items ------------------------- */

  function flagSave(msg, isErr){
    els.saveFlag.textContent = msg;
    els.saveFlag.classList.toggle('err', !!isErr);
    if(msg){
      window.clearTimeout(flagSave._t);
      flagSave._t = window.setTimeout(function(){ els.saveFlag.textContent = ''; }, 4000);
    }
  }

  function fetchItems(){
    return fetch(API_BASE)
      .then(function(res){
        if(!res.ok) throw new Error('load failed');
        return res.json();
      })
      .then(function(data){
        manualItems = (data && data.items) || [];
        renderCurrentDay();
      })
      .catch(function(){
        flagSave('Couldn’t load shared items — showing last known copy.', true);
      });
  }

  function fetchNotes(){
    return fetch(NOTES_API)
      .then(function(res){
        if(!res.ok) throw new Error('load failed');
        return res.json();
      })
      .then(function(data){
        liveNotes = (data && data.notes) || {};
        renderCurrentDay();
      })
      .catch(function(){ /* keep last known */ });
  }

  function saveNote(id){
    var ta = document.getElementById('note-ta-' + id);
    var text = ta ? ta.value.trim() : '';
    var btn = document.querySelector('[data-note-save="' + id + '"]');
    if(btn) btn.disabled = true;

    fetch(NOTES_API, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json', 'x-day-sheet-passcode': PASSCODE},
      body: JSON.stringify({id: id, text: text})
    })
      .then(function(res){
        if(res.status === 401){
          lockEditing();
          flagSave('Editing was locked — click Unlock editing and try again.', true);
          throw null;
        }
        if(!res.ok) throw new Error('save failed');
        return res.json();
      })
      .then(function(data){
        liveNotes = (data && data.notes) || liveNotes;
        noteEditingId = null;
        renderCurrentDay();
        flagSave(text ? 'Note saved.' : 'Note cleared.', false);
      })
      .catch(function(err){
        if(err) flagSave('Couldn’t save note — check your connection and try again.', true);
        if(btn) btn.disabled = false;
      });
  }

  /* ------------------------- passcode lock ------------------------- */

  function loadUnlockState(){
    try{
      UNLOCKED = window.localStorage.getItem(PASSCODE_STORAGE_KEY) === PASSCODE;
    }catch(e){
      UNLOCKED = false;
    }
  }

  function applyLockUI(){
    els.addItemBtn.hidden = !UNLOCKED;
    els.lockBtn.textContent = UNLOCKED ? 'Lock editing' : 'Unlock editing';
  }

  function promptUnlock(){
    var entered = window.prompt('Enter the passcode to edit this day sheet:');
    if(entered === null) return;
    if(entered.trim() === PASSCODE){
      try{ window.localStorage.setItem(PASSCODE_STORAGE_KEY, PASSCODE); }catch(e){}
      UNLOCKED = true;
      applyLockUI();
      closeForm();
      renderCurrentDay();
      renderReminder();
      flagSave('Editing unlocked on this device.', false);
    } else {
      flagSave('Wrong passcode.', true);
    }
  }

  function lockEditing(){
    try{ window.localStorage.removeItem(PASSCODE_STORAGE_KEY); }catch(e){}
    UNLOCKED = false;
    closeForm();
    noteEditingId = null;
    reminderEditing = false;
    applyLockUI();
    renderCurrentDay();
    renderReminder();
  }

  function openForm(itemId){
    if(!UNLOCKED){ promptUnlock(); return; }
    editingItemId = itemId || null;
    var item = editingItemId ? manualItems.find(function(i){ return i.id === editingItemId; }) : null;
    var itemDate = (item && item.date) || isoDateForOffset(selectedDayOffset);
    item = item || {start:'', end:'', title:'', category:'other', crew:'', note:''};

    els.formSlot.innerHTML =
      '<div class="form-card">' +
        '<div class="form-for">For <strong>' + escapeHtml(fmtFullDateFromISO(itemDate)) + '</strong></div>' +
        '<div class="form-grid">' +
          '<div class="field"><label for="f-start">Start time</label><input id="f-start" type="time" value="' + escapeHtml(item.start) + '"></div>' +
          '<div class="field"><label for="f-end">Finish time</label><input id="f-end" type="time" value="' + escapeHtml(item.end) + '"></div>' +
          '<div class="field full"><label for="f-cat">Category</label>' +
            '<select id="f-cat">' +
              Object.keys(CAT_LABEL).map(function(k){
                return '<option value="' + k + '"' + (k === item.category ? ' selected' : '') + '>' + CAT_LABEL[k] + '</option>';
              }).join('') +
            '</select>' +
          '</div>' +
          '<div class="field full"><label for="f-title">What</label><input id="f-title" type="text" placeholder="e.g. Borrowed forklift return — Acme Hire" value="' + escapeHtml(item.title) + '"></div>' +
          '<div class="field full"><label for="f-crew">Who</label><input id="f-crew" type="text" placeholder="e.g. Mick, Rick" value="' + escapeHtml(item.crew) + '"></div>' +
          '<div class="field full"><label for="f-note">Note</label><textarea id="f-note" maxlength="4000" placeholder="Any detail worth flagging">' + escapeHtml(item.note) + '</textarea></div>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn-secondary" type="button" id="f-cancel">Cancel</button>' +
          '<button class="btn-primary" type="button" id="f-save">' + (editingItemId ? 'Save changes' : 'Add item') + '</button>' +
        '</div>' +
      '</div>';

    document.getElementById('f-cancel').addEventListener('click', closeForm);
    document.getElementById('f-save').addEventListener('click', function(){ saveForm(itemDate); });
    document.getElementById('f-title').focus();
  }

  function closeForm(){
    editingItemId = null;
    els.formSlot.innerHTML = '';
  }

  function saveForm(itemDate){
    var start = document.getElementById('f-start').value;
    var end = document.getElementById('f-end').value;
    var category = document.getElementById('f-cat').value;
    var title = document.getElementById('f-title').value.trim();
    var crew = document.getElementById('f-crew').value.trim();
    var note = document.getElementById('f-note').value.trim();
    if(!title){
      document.getElementById('f-title').focus();
      return;
    }

    var payload = {date: itemDate, start: start, end: end, category: category, title: title, crew: crew, note: note};
    var isEdit = !!editingItemId;
    if(isEdit) payload.id = editingItemId;

    var saveBtn = document.getElementById('f-save');
    if(saveBtn){ saveBtn.disabled = true; }

    fetch(API_BASE, {
      method: isEdit ? 'PUT' : 'POST',
      headers: {'Content-Type': 'application/json', 'x-day-sheet-passcode': PASSCODE},
      body: JSON.stringify(payload)
    })
      .then(function(res){
        if(res.status === 401){
          lockEditing();
          flagSave('Editing was locked — click Unlock editing and try again.', true);
          throw null;
        }
        if(!res.ok) throw new Error('save failed');
        return res.json();
      })
      .then(function(data){
        manualItems = (data && data.items) || manualItems;
        closeForm();
        renderCurrentDay();
        flagSave(isEdit ? 'Item updated.' : 'Item added.', false);
      })
      .catch(function(err){
        if(err) flagSave('Couldn’t save — check your connection and try again.', true);
        if(saveBtn){ saveBtn.disabled = false; }
      });
  }

  function deleteItem(id){
    if(!id) return;
    if(!UNLOCKED){ promptUnlock(); return; }
    if(!window.confirm('Delete this item for everyone with this link?')) return;

    fetch(API_BASE + '?id=' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: {'x-day-sheet-passcode': PASSCODE}
    })
      .then(function(res){
        if(res.status === 401){
          lockEditing();
          flagSave('Editing was locked — click Unlock editing and try again.', true);
          throw null;
        }
        if(!res.ok) throw new Error('delete failed');
        return res.json();
      })
      .then(function(data){
        manualItems = (data && data.items) || manualItems.filter(function(i){ return i.id !== id; });
        renderCurrentDay();
        flagSave('Item deleted.', false);
      })
      .catch(function(err){
        if(err) flagSave('Couldn’t delete — check your connection and try again.', true);
      });
  }

  /* ------------------------- wiring ------------------------- */

  els.reloadBtn.addEventListener('click', function(){ location.reload(); });

  els.addItemBtn.addEventListener('click', function(){ openForm(null); });

  els.lockBtn.addEventListener('click', function(){
    if(UNLOCKED) lockEditing(); else promptUnlock();
  });

  els.dayTabs.querySelectorAll('.day-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      selectedDayOffset = parseInt(btn.getAttribute('data-offset'), 10);
      closeForm();
      noteEditingId = null;
      renderCurrentDay();
    });
  });

  function init(){
    loadUnlockState();
    applyLockUI();
    updateDayTabs();
    loadScheduleFromState();
    renderCurrentDay();
    renderSnapshotLabel();
    renderReminder();
    fetchItems();
    fetchNotes();
    fetchReminder();
    pollTimer = window.setInterval(function(){ fetchItems(); fetchNotes(); fetchReminder(); }, 20000);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible'){ fetchItems(); fetchNotes(); fetchReminder(); }
    });
  }

  init();
})();
</script>

</body></html>
