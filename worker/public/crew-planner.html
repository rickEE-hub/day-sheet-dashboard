<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>National Crew Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/*
  Layout: fixed top stat/header bar -> state filter tabs (ALL/NSW/VIC/QLD) ->
  horizontally scrollable 81-day chip strip (status dot = staffing state) ->
  selected day's jobs as a stacked card list, color-coded by state.
  Hash-deep-links to a single day (#2026-10-15).
*/
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#ECE8DF; --surface-3:#E3DED2;
  --fg:#211F1B; --fg-dim:#6E6A60; --border:#DCD6C8;
  --accent:#2454E8; --accent-soft:#E4EBFC;
  --ok:#0E9F6E; --ok-soft:#DFF5EC;
  --warn:#C2760B; --warn-soft:#FBEBD2;
  --danger:#C62828; --danger-soft:#FBE1DF;
  --state-nsw:#2454E8; --state-nsw-soft:#E4EBFC;
  --state-vic:#0E9F6E; --state-vic-soft:#DFF5EC;
  --state-qld:#DC2626; --state-qld-soft:#FCE2E1;
  --shadow: 0 1px 2px rgba(30,25,15,.06), 0 4px 14px rgba(30,25,15,.05);
  --font-display:'Oswald',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --surface:#1C1F24; --surface-2:#262A31; --surface-3:#2F343C;
    --fg:#EDEAE2; --fg-dim:#9A978D; --border:#363B44;
    --accent:#6D96F5; --accent-soft:#223052;
    --ok:#3FCB93; --ok-soft:#163528;
    --warn:#E0A53D; --warn-soft:#3A2C12;
    --danger:#F0776F; --danger-soft:#3C1E1D;
    --state-nsw:#6D96F5; --state-nsw-soft:#1F2C4A;
    --state-vic:#3FCB93; --state-vic-soft:#143426;
    --state-qld:#F0776F; --state-qld-soft:#3C1E1D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1C1F24; --surface-2:#262A31; --surface-3:#2F343C;
  --fg:#EDEAE2; --fg-dim:#9A978D; --border:#363B44;
  --accent:#6D96F5; --accent-soft:#223052;
  --ok:#3FCB93; --ok-soft:#163528;
  --warn:#E0A53D; --warn-soft:#3A2C12;
  --danger:#F0776F; --danger-soft:#3C1E1D;
  --state-nsw:#6D96F5; --state-nsw-soft:#1F2C4A;
  --state-vic:#3FCB93; --state-vic-soft:#143426;
  --state-qld:#F0776F; --state-qld-soft:#3C1E1D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:18px 48px;}

/* ---- Header ---- */
header.top{display:flex; flex-direction:column; gap:4px; margin-bottom:16px;}
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}
h1{
  font-family:var(--font-display); font-weight:600; font-size:clamp(26px,5vw,34px);
  margin:2px 0 2px; letter-spacing:.01em; text-wrap:balance;
}
.subtitle{color:var(--fg-dim); font-size:14px; margin:0;}

/* ---- Stat tiles ---- */
.stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px 0 16px;
}
@media (max-width:640px){ .stats{grid-template-columns:repeat(2,1fr);} }
.tile{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; box-shadow:var(--shadow); min-width:0;
}
.tile .num{
  font-family:var(--font-mono); font-weight:600; font-size:24px; font-variant-numeric:tabular-nums;
  line-height:1.1;
}
.tile .label{font-size:11px; color:var(--fg-dim); margin-top:2px; letter-spacing:.02em;}
.tile.danger .num{color:var(--danger);}
.tile.ok .num{color:var(--ok);}
.tile.accent .num{color:var(--accent);}

/* ---- State filter tabs ---- */
.state-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.state-tab{
  font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.03em;
  padding:7px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface);
  color:var(--fg-dim); cursor:pointer; transition:all .12s;
}
.state-tab:hover{border-color:var(--fg-dim);}
.state-tab.active{color:#fff; border-color:transparent;}
.state-tab[data-state="ALL"].active{background:var(--fg); }
.state-tab[data-state="NSW"].active{background:var(--state-nsw);}
.state-tab[data-state="VIC"].active{background:var(--state-vic);}
.state-tab[data-state="QLD"].active{background:var(--state-qld);}
.state-tab[data-state="NSW"]:not(.active){color:var(--state-nsw); border-color:var(--state-nsw-soft);}
.state-tab[data-state="VIC"]:not(.active){color:var(--state-vic); border-color:var(--state-vic-soft);}
.state-tab[data-state="QLD"]:not(.active){color:var(--state-qld); border-color:var(--state-qld-soft);}

/* ---- Day strip ---- */
.strip-row{display:flex; align-items:center; gap:6px; margin-bottom:4px;}
.nav-btn{
  flex:0 0 auto; width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--fg); font-size:16px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; box-shadow:var(--shadow);
}
.nav-btn:hover{background:var(--surface-2);}
.nav-btn:active{transform:translateY(1px);}
.strip-scroll{
  flex:1 1 auto; min-width:0; overflow-x:auto; scroll-behavior:smooth; scroll-snap-type:x proximity;
  padding-block:2px 10px; -webkit-overflow-scrolling:touch;
}
.strip{display:flex; gap:8px; width:max-content;}
.day-chip{
  scroll-snap-align:start; flex:0 0 auto; width:66px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); padding:8px 6px 7px; cursor:pointer; text-align:center; position:relative;
  transition:border-color .12s, background .12s;
}
.day-chip:hover{border-color:var(--accent);}
.day-chip.is-selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent) inset;}
.day-chip .dow{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-dim); font-weight:600;}
.day-chip .dom{font-family:var(--font-display); font-size:20px; font-weight:600; line-height:1.15; margin:1px 0;}
.day-chip .mon{font-size:9px; color:var(--fg-dim); text-transform:uppercase; letter-spacing:.04em;}
.day-chip .dot-row{display:flex; justify-content:center; align-items:center; gap:3px; margin-top:5px; height:8px;}
.dot{width:6px; height:6px; border-radius:50%; background:var(--border);}
.dot.danger{background:var(--danger);}
.dot.warn{background:var(--warn);}
.dot.ok{background:var(--ok);}
.day-chip .count{
  position:absolute; top:-6px; right:-4px; background:var(--surface-3); color:var(--fg);
  font-family:var(--font-mono); font-size:10px; font-weight:600; border-radius:999px;
  min-width:16px; height:16px; padding:0 3px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border);
}
.day-chip.is-today{outline:2px dashed var(--accent); outline-offset:1px;}

.jump-today{
  font-family:var(--font-mono); font-size:11px; color:var(--accent); background:none; border:none;
  cursor:pointer; padding:0 2px 10px; text-decoration:underline; text-underline-offset:2px;
}

/* ---- Selected day panel ---- */
.day-panel{margin-top:14px;}
.day-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
  margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid var(--border);
}
.day-head h2{
  font-family:var(--font-display); font-size:22px; font-weight:600; margin:0; letter-spacing:.01em;
}
.day-head .meta{font-family:var(--font-mono); font-size:12px; color:var(--fg-dim);}

.empty-state{
  text-align:center; padding:40px 16px; color:var(--fg-dim); font-size:14px;
  border:1px dashed var(--border); border-radius:12px; background:var(--surface);
}
.empty-state .big{font-family:var(--font-display); font-size:18px; color:var(--fg); margin-bottom:4px;}

.job-list{display:flex; flex-direction:column; gap:10px;}
.job{
  background:var(--surface); border:1px solid var(--border); border-left-width:5px;
  border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
}
.job-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;}
.job-time{
  font-family:var(--font-mono); font-weight:600; font-size:14px; font-variant-numeric:tabular-nums;
  color:var(--accent); white-space:nowrap;
}
.job-title-wrap{min-width:0;}
.job-event{font-weight:600; font-size:15px; line-height:1.3;}
.job-task{font-size:12.5px; color:var(--fg-dim); margin-top:1px;}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.chip{
  font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--fg-dim); white-space:nowrap;
}
.chip.status{background:var(--surface-3); color:var(--fg);}
.chip.state-nsw{background:var(--state-nsw-soft); color:var(--state-nsw);}
.chip.state-vic{background:var(--state-vic-soft); color:var(--state-vic);}
.chip.state-qld{background:var(--state-qld-soft); color:var(--state-qld);}
.venue-line{font-size:13px; color:var(--fg); display:flex; gap:6px; flex-wrap:wrap;}
.venue-line .addr{color:var(--fg-dim);}
.crew-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px;
  background:var(--surface-2); border-radius:8px; padding:8px 10px;
}
.crew-gauge{
  font-family:var(--font-mono); font-weight:600; font-size:12px; padding:2px 8px; border-radius:6px;
  white-space:nowrap;
}
.crew-gauge.gap{background:var(--danger-soft); color:var(--danger);}
.crew-gauge.full{background:var(--ok-soft); color:var(--ok);}
.crew-names{color:var(--fg); flex:1 1 180px; min-width:0;}
.crew-names.unassigned{color:var(--fg-dim); font-style:italic;}
.veh-line{font-size:12px; color:var(--fg-dim); display:flex; gap:5px; align-items:center;}

.legend{
  margin-top:26px; padding-top:14px; border-top:1px solid var(--border);
  display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--fg-dim); align-items:center;
}
.legend .item{display:flex; align-items:center; gap:6px;}
.legend .sw{width:10px; height:10px; border-radius:3px;}

.footnote{font-size:11px; color:var(--fg-dim); margin-top:18px; line-height:1.5;}

@media (prefers-reduced-motion:reduce){ .strip-scroll{scroll-behavior:auto;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">Event Equipment Group &middot; NSW / VIC / QLD</span>
    <h1>National Crew Planner</h1>
    <p class="subtitle">All jobs through 20 December, every state &mdash; pick a day to see what's running and who's booked.</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="state-tabs" id="stateTabs">
    <button class="state-tab" data-state="ALL">ALL</button>
    <button class="state-tab" data-state="NSW">NSW</button>
    <button class="state-tab" data-state="VIC">VIC</button>
    <button class="state-tab" data-state="QLD">QLD</button>
  </div>

  <div class="strip-row">
    <button class="nav-btn" id="prevBtn" aria-label="Previous day" title="Previous day">&#8592;</button>
    <div class="strip-scroll" id="stripScroll">
      <div class="strip" id="strip"></div>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Next day" title="Next day">&#8594;</button>
  </div>
  <button class="jump-today" id="jumpToday">Jump to today</button>

  <div class="day-panel">
    <div class="day-head">
      <h2 id="dayHeadline">&nbsp;</h2>
      <span class="meta" id="dayMeta"></span>
    </div>
    <div class="job-list" id="jobList"></div>
  </div>

  <div class="legend">
    <span class="item"><span class="sw" style="background:var(--danger)"></span> Crew gap</span>
    <span class="item"><span class="sw" style="background:var(--ok)"></span> Fully crewed</span>
    <span class="item"><span class="sw" style="background:var(--state-nsw)"></span> NSW</span>
    <span class="item"><span class="sw" style="background:var(--state-vic)"></span> VIC</span>
    <span class="item"><span class="sw" style="background:var(--state-qld)"></span> QLD</span>
  </div>
  <p class="footnote" id="footnote"></p>
</div>

<script>
(function(){
  "use strict";
  var raw = document.getElementById('wallboard-data').textContent;
  var data = JSON.parse(raw);
  var DAYS = data.days;
  var EVENTS_ALL = data.events;
  var GENERATED_AT = data.generatedAt || '';
  var TODAY = DAYS[0];
  var selectedState = 'ALL';

  function formatStamp(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Australia/Sydney'}) + ' Sydney time';
  }

  function parseYMD(s){
    var p = s.split('-');
    return new Date(Date.UTC(+p[0], +p[1]-1, +p[2], 12));
  }
  function dowShort(s){ return parseYMD(s).toLocaleDateString('en-AU',{weekday:'short',timeZone:'UTC'}).toUpperCase(); }
  function monShort(s){ return parseYMD(s).toLocaleDateString('en-AU',{month:'short',timeZone:'UTC'}).toUpperCase(); }
  function domNum(s){ return String(+s.split('-')[2]); }
  function fullLabel(s){ return parseYMD(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}); }

  function eventsForDay(dateStr){
    var evs = EVENTS_ALL[dateStr] || [];
    if (selectedState === 'ALL') return evs;
    return evs.filter(function(e){ return e.state === selectedState; });
  }

  function dayStatus(dateStr){
    var evs = eventsForDay(dateStr);
    if (!evs.length) return 'none';
    var anyGap = evs.some(function(e){ return e.crew_count < e.crew_needed; });
    var allFull = evs.every(function(e){ return e.crew_count >= e.crew_needed; });
    if (anyGap) return 'danger';
    if (allFull) return 'ok';
    return 'warn';
  }

  var selected = (location.hash && /^#\d{4}-\d{2}-\d{2}$/.test(location.hash) && DAYS.indexOf(location.hash.slice(1)) !== -1)
    ? location.hash.slice(1) : TODAY;

  function renderStats(){
    var totalJobs = 0, totalGap = 0, busiestDay = null, busiestCount = 0, daysWithJobs = 0;
    DAYS.forEach(function(d){
      var evs = eventsForDay(d);
      if (evs.length) daysWithJobs++;
      totalJobs += evs.length;
      evs.forEach(function(e){ if (e.crew_count < e.crew_needed) totalGap++; });
      if (evs.length > busiestCount){ busiestCount = evs.length; busiestDay = d; }
    });
    var el = document.getElementById('stats');
    var scopeLabel = selectedState === 'ALL' ? 'all states' : selectedState;
    var tiles = [
      {cls:'accent', num:totalJobs, label:'Jobs through Dec 20 (' + scopeLabel + ')'},
      {cls:'danger', num:totalGap, label:'Crew gaps to fill'},
      {cls:'', num:daysWithJobs, label:'Days with jobs scheduled'},
      {cls:'ok', num: busiestDay ? (busiestCount + ' on ' + domNum(busiestDay) + ' ' + monShort(busiestDay)) : '—', label:'Busiest day'}
    ];
    el.innerHTML = tiles.map(function(t){
      return '<div class="tile ' + t.cls + '"><div class="num">' + t.num + '</div><div class="label">' + t.label + '</div></div>';
    }).join('');
  }

  function renderStateTabs(){
    document.querySelectorAll('.state-tab').forEach(function(tab){
      tab.classList.toggle('active', tab.getAttribute('data-state') === selectedState);
    });
  }

  function renderStrip(){
    var strip = document.getElementById('strip');
    strip.innerHTML = DAYS.map(function(d){
      var evs = eventsForDay(d);
      var status = dayStatus(d);
      var isSel = d === selected;
      var isToday = d === TODAY;
      var dots = '';
      if (evs.length){
        var dotClass = status === 'danger' ? 'danger' : (status === 'warn' ? 'warn' : 'ok');
        dots = '<span class="dot ' + dotClass + '"></span>';
      } else {
        dots = '<span class="dot"></span>';
      }
      return '<div class="day-chip' + (isSel ? ' is-selected' : '') + (isToday ? ' is-today' : '') + '" data-date="' + d + '" tabindex="0" role="button" aria-label="' + fullLabel(d) + '">' +
        (evs.length ? '<span class="count">' + evs.length + '</span>' : '') +
        '<div class="dow">' + dowShort(d) + '</div>' +
        '<div class="dom">' + domNum(d) + '</div>' +
        '<div class="mon">' + monShort(d) + '</div>' +
        '<div class="dot-row">' + dots + '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(strip.querySelectorAll('.day-chip'), function(chip){
      chip.addEventListener('click', function(){ selectDay(chip.getAttribute('data-date')); });
      chip.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); selectDay(chip.getAttribute('data-date')); }
      });
    });
  }

  function scrollChipIntoView(d){
    var chip = document.querySelector('.day-chip[data-date="' + d + '"]');
    if (chip) chip.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function stateChipClass(state){
    if (state === 'NSW') return 'state-nsw';
    if (state === 'VIC') return 'state-vic';
    if (state === 'QLD') return 'state-qld';
    return '';
  }
  function stateBorderVar(state){
    if (state === 'NSW') return 'var(--state-nsw)';
    if (state === 'VIC') return 'var(--state-vic)';
    if (state === 'QLD') return 'var(--state-qld)';
    return 'var(--border)';
  }

  function renderPanel(){
    document.getElementById('dayHeadline').textContent = fullLabel(selected);
    var evs = eventsForDay(selected).slice();
    var idx = DAYS.indexOf(selected);
    var metaText = 'Day ' + (idx+1) + ' of ' + DAYS.length + (selected === TODAY ? '  ·  TODAY' : '');
    document.getElementById('dayMeta').textContent = metaText;

    var list = document.getElementById('jobList');
    if (!evs.length){
      list.innerHTML = '<div class="empty-state"><div class="big">No jobs scheduled</div>Nothing booked for this date' + (selectedState === 'ALL' ? '' : ' in ' + selectedState) + ' yet.</div>';
      return;
    }

    list.innerHTML = evs.map(function(e){
      var gap = e.crew_needed - e.crew_count;
      var isGap = gap > 0;
      var crewText = e.crew_assigned && e.crew_assigned.length ? e.crew_assigned : 'Unassigned';
      var vehText = e.vehicles && e.vehicles.trim().length ? e.vehicles.replace(/\s*·\s*$/, '') : '';
      return '<div class="job" style="border-left-color:' + stateBorderVar(e.state) + '">' +
        '<div class="job-top">' +
          '<div class="job-time">' + e.start_time + (e.end_time && e.end_time !== e.start_time ? ' – ' + e.end_time : '') + '</div>' +
          '<div class="chips">' +
            '<span class="chip ' + stateChipClass(e.state) + '">' + escapeHtml(e.state) + '</span>' +
            '<span class="chip">' + escapeHtml(e.category) + '</span>' +
            '<span class="chip status">' + escapeHtml(e.status) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="job-title-wrap">' +
          '<div class="job-event">' + escapeHtml(e.event) + '</div>' +
          '<div class="job-task">' + escapeHtml(e.function) + '</div>' +
        '</div>' +
        '<div class="venue-line">' +
          '<strong>' + escapeHtml(e.venue || 'Venue TBC') + '</strong>' +
          (e.address ? '<span class="addr">&middot; ' + escapeHtml(e.address) + '</span>' : '') +
        '</div>' +
        '<div class="crew-row">' +
          '<span class="crew-gauge ' + (isGap ? 'gap' : 'full') + '">' + e.crew_count + ' / ' + e.crew_needed + ' crewed</span>' +
          '<span class="crew-names' + (crewText === 'Unassigned' ? ' unassigned' : '') + '">' + escapeHtml(crewText) + '</span>' +
        '</div>' +
        (vehText ? '<div class="veh-line">&#128666; ' + escapeHtml(vehText) + '</div>' : '') +
      '</div>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function selectDay(d, opts){
    opts = opts || {};
    selected = d;
    try { history.replaceState(null, '', '#' + d); } catch(e){}
    document.querySelectorAll('.day-chip').forEach(function(c){
      c.classList.toggle('is-selected', c.getAttribute('data-date') === d);
    });
    renderPanel();
    if (!opts.skipScroll) scrollChipIntoView(d);
  }

  function setState(s){
    selectedState = s;
    try { localStorage.setItem('national-crew-planner-state', s); } catch(e){}
    renderStateTabs();
    renderStats();
    renderStrip();
    renderPanel();
    scrollChipIntoView(selected);
  }

  document.querySelectorAll('.state-tab').forEach(function(tab){
    tab.addEventListener('click', function(){ setState(tab.getAttribute('data-state')); });
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    var idx = DAYS.indexOf(selected);
    if (idx > 0) selectDay(DAYS[idx-1]);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    var idx = DAYS.indexOf(selected);
    if (idx < DAYS.length-1) selectDay(DAYS[idx+1]);
  });
  document.getElementById('jumpToday').addEventListener('click', function(){ selectDay(TODAY); });

  window.addEventListener('hashchange', function(){
    var h = location.hash.replace('#','');
    if (DAYS.indexOf(h) !== -1) selectDay(h, {skipScroll:false});
  });

  var first = DAYS[0], last = DAYS[DAYS.length-1];
  var genLine = GENERATED_AT ? ('Data built ' + formatStamp(GENERATED_AT) + ' · ') : '';
  document.getElementById('footnote').textContent =
    genLine + 'Window: ' + first + ' to ' + last + ' · NSW + VIC + QLD (Rentman asset_location_from) · crew & vehicle assignments pulled fresh per function · standalone snapshot, not connected to the live Daily Schedule site.';

  var savedState = null;
  try { savedState = localStorage.getItem('national-crew-planner-state'); } catch(e){}
  if (savedState && ['ALL','NSW','VIC','QLD'].indexOf(savedState) !== -1) selectedState = savedState;

  renderStateTabs();
  renderStats();
  renderStrip();
  renderPanel();
  scrollChipIntoView(selected);
})();
</script>

</body>
</html>
