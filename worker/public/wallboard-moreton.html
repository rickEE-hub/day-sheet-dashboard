<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moreton Hire — Wall Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#EEF1F5;
    --ink:#171B21;
    --ink-dim:#5B6472;
    --ink-faint:#94A0AF;
    --border:#E3E7ED;
    --border-strong:#C9D0DA;
    --accent:#2454E8;
    --accent-ink:#FFFFFF;
    --accent-soft:#E4EBFD;
    --status-confirmed:#0E9F6E;
    --status-confirmed-soft:#DCF7EC;
    --status-pending:#B45309;
    --status-pending-soft:#FDECD3;
    --level-1:#16A34A;
    --level-1-soft:#DCFCE7;
    --level-2:#EAB308;
    --level-2-soft:#FEF9C3;
    --level-3:#DC2626;
    --level-3-soft:#FEE2E2;
    --shadow: 0 1px 2px rgba(20,25,35,.04), 0 8px 24px rgba(20,25,35,.06);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161C;
      --surface:#1B212B;
      --surface-2:#232A35;
      --ink:#EDEFF3;
      --ink-dim:#9AA3B2;
      --ink-faint:#6B7484;
      --border:#2A313D;
      --border-strong:#3A4250;
      --accent:#6B93F7;
      --accent-ink:#0B1220;
      --accent-soft:#1E2A4A;
      --status-confirmed:#3EDCA0;
      --status-confirmed-soft:#123528;
      --status-pending:#FBBF6D;
      --status-pending-soft:#3A2A11;
      --level-1:#4ADE80;
      --level-1-soft:#123528;
      --level-2:#FDE047;
      --level-2-soft:#3A2E05;
      --level-3:#F87171;
      --level-3-soft:#3B1A1A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161C;
    --surface:#1B212B;
    --surface-2:#232A35;
    --ink:#EDEFF3;
    --ink-dim:#9AA3B2;
    --ink-faint:#6B7484;
    --border:#2A313D;
    --border-strong:#3A4250;
    --accent:#6B93F7;
    --accent-ink:#0B1220;
    --accent-soft:#1E2A4A;
    --status-confirmed:#3EDCA0;
    --status-confirmed-soft:#123528;
    --status-pending:#FBBF6D;
    --status-pending-soft:#3A2A11;
    --level-1:#4ADE80;
    --level-1-soft:#123528;
    --level-2:#FDE047;
    --level-2-soft:#3A2E05;
    --level-3:#F87171;
    --level-3-soft:#3B1A1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  .wrap{max-width:1760px; margin:0 auto; padding:20px 24px 60px;}

  /* ---- Logo bar ---- */
  .logo-bar{display:flex; justify-content:flex-end; align-items:center; gap:22px; margin-bottom:14px;}
  .logo-plate img{display:block; height:86.4px; width:auto;}
  .logo-plate.ee img{height:60px;}

  /* ---- Header ---- */
  .masthead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
  .eyebrow{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:600;}
  h1{font-weight:800; letter-spacing:-.02em; font-size:clamp(24px,3.4vw,32px); margin:2px 0 2px; text-wrap:balance;}
  .date-line{font-size:14px; color:var(--ink-dim); font-weight:500;}
  .snapshot-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    padding:5px 11px; border-radius:100px;
    background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--border);
    white-space:nowrap;
  }

  /* ---- Week switcher ---- */
  .switcher{
    display:inline-flex; gap:4px; background:var(--surface-2);
    padding:4px; border-radius:12px; border:1px solid var(--border); margin-bottom:16px;
  }
  .switch-btn{
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-dim);
    padding:9px 20px; border-radius:9px;
  }
  .switch-btn:hover{color:var(--ink);}
  .switch-btn.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}
  .switch-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---- Legend ---- */
  .legend{display:flex; flex-wrap:wrap; gap:10px 16px; padding:0 0 18px; font-size:12px; color:var(--ink-dim);}
  .legend-item{display:inline-flex; align-items:center; gap:6px;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex:none;}

  [hidden]{display:none !important;}

  /* ---- Pills / badges ---- */
  .pill{font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:4px 10px; border-radius:100px; white-space:nowrap; display:inline-block;}
  .pill-confirmed{background:var(--status-confirmed-soft); color:var(--status-confirmed);}
  .pill-pending{background:var(--status-pending-soft); color:var(--status-pending);}

  .level-badge{
    width:26px; height:26px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px;
    border:2px solid transparent;
  }
  .level-1 .level-badge{background:var(--level-1-soft); color:var(--level-1); border-color:var(--level-1);}
  .level-2 .level-badge{background:var(--level-2-soft); color:var(--level-2); border-color:var(--level-2);}
  .level-3 .level-badge{background:var(--level-3-soft); color:var(--level-3); border-color:var(--level-3);}

  /* ---- 7-day grid ---- */
  .wall-scroll{overflow-x:auto; padding-bottom:6px; margin:0 -24px; padding-left:24px; padding-right:24px;}
  .wall-grid{display:grid; gap:12px; align-items:start; grid-template-columns:repeat(7,minmax(216px,1fr));}

  .wcol-head{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 12px; margin-bottom:10px; display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .wcol-head.today{background:var(--accent); border-color:var(--accent);}
  .wcol-wd{font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-dim);}
  .wcol-head.today .wcol-wd{color:var(--accent-ink); opacity:.85;}
  .wcol-date{font-size:12px; font-weight:600; color:var(--ink-faint);}
  .wcol-head.today .wcol-date{color:var(--accent-ink); opacity:.85;}
  .wcol-count{font-size:11px; font-weight:700; color:var(--ink-faint);}
  .wcol-head.today .wcol-count{color:var(--accent-ink);}

  .wcard{background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:var(--shadow); padding:11px 13px; margin-bottom:9px;}
  .wcard-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:4px;}
  .wcard-title{font-weight:700; font-size:13.5px; line-height:1.3; overflow-wrap:anywhere;}
  .wcard-time{font-family:'JetBrains Mono', monospace; font-variant-numeric:tabular-nums; font-size:10.5px; font-weight:600; color:var(--ink-faint); margin-bottom:6px;}
  .wcard-venue{font-size:11.5px; color:var(--ink-dim); line-height:1.35;}
  .wcard-venue .state{color:var(--ink-faint); font-weight:600;}
  .wcard-am{font-size:11.5px; color:var(--ink-dim); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);}
  .wcard-am .lbl{color:var(--ink-faint); font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; display:block; margin-bottom:2px;}
  .wcard-foot{margin-top:8px; display:flex; justify-content:flex-end;}
  .wempty{font-size:11.5px; color:var(--ink-faint); font-style:italic; padding:14px 4px; text-align:center;}

  footer{
    margin-top:36px; padding-top:14px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:900px){
    .wall-grid{grid-template-columns:repeat(7,minmax(190px,1fr));}
  }
</style>
</head>

<script id="app-script">
(function(){
  "use strict";

  var els = {
    dateLine: document.getElementById('date-line'),
    snapshotLabel: document.getElementById('snapshot-label'),
    footerCount: document.getElementById('footer-count'),
    grid: document.getElementById('grid')
  };

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtTime(iso){
    if(!iso) return null;
    var d = new Date(iso);
    if(isNaN(d)) return null;
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', hour:'2-digit', minute:'2-digit', hour12:false
    });
    return fmt.format(d);
  }

  // Parses a "YYYY-MM-DD" schedule key into a fixed UTC-noon Date so
  // weekday/day/month formatting is immune to the viewer's own timezone
  // and to DST edges (same pattern as the main Daily Schedule pages).
  function dateFromKey(key){
    var bits = key.split('-');
    return new Date(Date.UTC(+bits[0], +bits[1]-1, +bits[2], 12, 0, 0));
  }
  function keyForOffset(startKey, offsetDays){
    var d = dateFromKey(startKey);
    d.setUTCDate(d.getUTCDate() + offsetDays);
    return d.toISOString().slice(0, 10);
  }
  function fmtWeekday(key){
    return new Intl.DateTimeFormat('en-AU', {weekday:'short'}).format(dateFromKey(key)).toUpperCase();
  }
  function fmtDateShort(key){
    return new Intl.DateTimeFormat('en-AU', {day:'numeric', month:'short'}).format(dateFromKey(key));
  }
  function fmtDateLine(startKey, endKey){
    var fmt = new Intl.DateTimeFormat('en-AU', {day:'numeric', month:'long', year:'numeric'});
    return fmt.format(dateFromKey(startKey)) + ' – ' + fmt.format(dateFromKey(endKey));
  }
  function fmtSnapshot(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d)) return '—';
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone:'Australia/Sydney', weekday:'short', day:'numeric', month:'short',
      year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false
    });
    return fmt.format(d) + ' AEST/AEDT';
  }

  function getData(){
    var raw = document.getElementById('wallboard-data').textContent;
    var parsed = JSON.parse(raw);
    if(!parsed.days) parsed.days = {};
    return parsed;
  }

  // The window always starts on a Monday (see windowStart) and runs 4
  // full Monday–Sunday weeks — "today" is derived from the real Sydney
  // calendar date, never assumed to be the first baked day, so the board
  // still lands on the correct week/day after it rolls past windowStart.
  function sydneyTodayKey(){
    return new Intl.DateTimeFormat('en-CA', {
      timeZone:'Australia/Sydney', year:'numeric', month:'2-digit', day:'2-digit'
    }).format(new Date());
  }

  var data = getData();
  var startKey = data.windowStart;
  var dayKeys = [];
  for(var i = 0; i < 28; i++){ dayKeys.push(keyForOffset(startKey, i)); }
  var todayKey = sydneyTodayKey();

  var days = dayKeys.map(function(key){
    var jobs = (data.days[key] || []).slice();
    jobs.sort(function(a, b){ return (a.time || '').localeCompare(b.time || ''); });
    return {key:key, jobs:jobs, today: key === todayKey};
  });

  var weeks = [days.slice(0, 7), days.slice(7, 14), days.slice(14, 21), days.slice(21, 28)];

  function weekIndexForToday(){
    for(var w = 0; w < weeks.length; w++){
      for(var d = 0; d < weeks[w].length; d++){
        if(weeks[w][d].key === todayKey) return w;
      }
    }
    return 0;
  }

  function statusPill(status){
    var label = status === 'confirmed' ? 'Crew Confirmed' : 'Crew Pending';
    return '<span class="pill pill-' + (status === 'confirmed' ? 'confirmed' : 'pending') + '">' + label + '</span>';
  }

  function levelBadge(level){
    return '<span class="level-badge">' + level + '</span>';
  }

  function jobCardHtml(job){
    var time = fmtTime(job.time);
    return (
      '<div class="wcard level-' + job.level + '">' +
        '<div class="wcard-head">' +
          '<div class="wcard-title">' + escapeHtml(job.title) + '</div>' +
          levelBadge(job.level) +
        '</div>' +
        (time ? '<div class="wcard-time">' + time + '</div>' : '') +
        '<div class="wcard-venue">' + escapeHtml(job.venue) + ' &middot; <span class="state">' + escapeHtml(job.state) + '</span></div>' +
        '<div class="wcard-am"><span class="lbl">Account manager</span>' + escapeHtml(job.accountManager || '—') + '</div>' +
        '<div class="wcard-foot">' + statusPill(job.crewStatus) + '</div>' +
      '</div>'
    );
  }

  function renderWeek(weekIdx){
    var weekDays = weeks[weekIdx];
    els.grid.innerHTML = weekDays.map(function(day){
      var head = '<div class="wcol-head' + (day.today ? ' today' : '') + '">' +
        '<span><span class="wcol-wd">' + fmtWeekday(day.key) + '</span> <span class="wcol-date">' + fmtDateShort(day.key) + '</span></span>' +
        '<span class="wcol-count">' + day.jobs.length + '</span></div>';
      var body = day.jobs.length
        ? day.jobs.map(jobCardHtml).join('')
        : '<div class="wempty">No Moreton jobs</div>';
      return '<div class="wcol">' + head + body + '</div>';
    }).join('');
    els.dateLine.textContent = fmtDateLine(weekDays[0].key, weekDays[weekDays.length - 1].key);
    var total = weekDays.reduce(function(sum, d){ return sum + d.jobs.length; }, 0);
    els.footerCount.textContent = total + ' job' + (total === 1 ? '' : 's') + ' this week';
  }

  var tabs = {
    '0':document.getElementById('tab-w0'), '1':document.getElementById('tab-w1'),
    '2':document.getElementById('tab-w2'), '3':document.getElementById('tab-w3')
  };
  function setWeek(w){
    Object.keys(tabs).forEach(function(k){
      tabs[k].classList.toggle('active', k === w);
      tabs[k].setAttribute('aria-selected', k === w ? 'true' : 'false');
    });
    renderWeek(+w);
  }
  Object.keys(tabs).forEach(function(k){
    tabs[k].addEventListener('click', function(){ setWeek(k); });
  });
  // Always open on the week containing today, not a remembered choice —
  // the board must show Mon–Sun of the current week until it rolls over,
  // and the 10-minute auto-reload re-derives this every time regardless.
  setWeek(String(weekIndexForToday()));

  els.snapshotLabel.textContent = 'snapshot: ' + fmtSnapshot(data.generatedAt);

  // Unattended TV display: nobody is at the warehouse screen to hit reload,
  // so pick up each manual refresh automatically.
  setInterval(function(){ location.reload(); }, 10 * 60 * 1000);
})();
</script>
