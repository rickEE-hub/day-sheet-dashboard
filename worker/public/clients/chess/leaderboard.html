:root{--midnight:#07182d;--deep:#040f1e;--cisco:#02c8ff;--blue:#0a60ff;--magenta:#ff007f;--orange:#ff9000;
  --gold:#ffc83d;--silver:#d5dde8;--bronze:#e08a4f;
  --ribbon:linear-gradient(90deg,#0a60ff 5%,#02c8ff 37%,#02c8ff 44%,#ff007f 75%,#ff9000 95%);
  --line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.62);--card:rgba(255,255,255,.055)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;cursor:none}
body{font-family:"Inter Brand",Inter,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
/* fixed 1080×1920 canvas, scaled to fit any portrait screen */
#stage{width:1080px;height:1920px;flex:none;position:relative;overflow:hidden;background:radial-gradient(120% 55% at 50% 0%,#0f2f57 0%,var(--midnight) 55%,var(--deep) 100%);transform-origin:center center;display:flex;flex-direction:column;padding:0 56px}
.ribbon{position:absolute;left:0;right:0;height:10px;background:var(--ribbon);z-index:3}
.ribbon.top{top:0}.ribbon.bot{bottom:0}
header{padding:64px 0 18px;text-align:center}
header img{height:52px}
h1{margin:22px 0 0;font-size:80px;font-weight:600;letter-spacing:-.03em;line-height:1}
.subt{margin:12px 0 0;font-size:30px;color:var(--muted)}
.subt b{color:#fff;font-weight:600}
.closed{margin:14px auto 0;display:inline-block;font-size:24px;font-weight:600;padding:8px 22px;border-radius:999px;background:rgba(255,0,127,.18);color:#ff7ab8}
.closed[hidden]{display:none}
/* main board: Today / Overall, switching */

.tabs{display:flex;gap:12px;margin-bottom:20px}
.tab{flex:1;position:relative;text-align:center;font-size:28px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:16px 0 18px;border-radius:18px;color:var(--muted);background:rgba(255,255,255,.04);overflow:hidden}
.tab.on{color:var(--midnight);background:var(--cisco)}
.tab .prog{position:absolute;left:0;bottom:0;height:6px;background:rgba(7,24,45,.35);width:0}
.tab.on .prog{animation:prog var(--dur,15s) linear forwards}
@keyframes prog{to{width:100%}}
.rows{display:flex;flex-direction:column;gap:8px;transition:opacity .45s,transform .45s}
.rows.out{opacity:0;transform:translateX(-40px)}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:18px;height:76px;padding:0 26px;border-radius:18px;background:rgba(255,255,255,.05)}
.row .r{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--cisco)}
.row .n{font-size:38px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row .p small{font-size:22px;color:var(--muted);margin-left:8px;font-weight:400;letter-spacing:0}
.row.m1{background:linear-gradient(90deg,rgba(255,200,61,.30),rgba(255,200,61,.06))}
.row.m1 .r{color:var(--gold)}
.row.m2 .r{color:var(--silver)}.row.m3 .r{color:var(--bronze)}
.row.m2{background:linear-gradient(90deg,rgba(213,221,232,.18),rgba(255,255,255,.05))}
.row.m3{background:linear-gradient(90deg,rgba(224,138,79,.2),rgba(255,255,255,.05))}
.row.new{animation:pop 1.4s ease}
@keyframes pop{0%{box-shadow:0 0 0 3px var(--cisco) inset}100%{box-shadow:0 0 0 0 transparent inset}}
.none{font-size:34px;color:var(--muted);text-align:center;margin-top:220px;line-height:1.45}
/* daily champions */

.cday{border-radius:24px;background:var(--card);border:1px solid var(--line);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.cday.now{border-color:rgba(2,200,255,.6);background:linear-gradient(180deg,rgba(2,200,255,.14),rgba(255,255,255,.04))}
.ch{display:flex;justify-content:space-between;align-items:baseline}
.ch b{font-size:28px;font-weight:700}
.ch span{font-size:18px;color:var(--muted)}
.tag{align-self:flex-start;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--muted)}
.cday.now .tag{background:var(--magenta);color:#fff}
.cday.done .tag{background:rgba(255,200,61,.2);color:var(--gold)}
.cl{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:23px}
.cl i{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:800;color:var(--midnight)}
.cl .g{background:var(--gold)}.cl .s{background:var(--silver)}.cl .b{background:var(--bronze)}
.cl em{font-style:normal;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl small{font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.cmore{font-size:19px;color:var(--muted);text-align:center}
.csoon{font-size:22px;color:var(--muted);margin-top:auto;margin-bottom:auto;text-align:center;line-height:1.4}
/* countdown + footer */
.gmbar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-radius:22px;background:linear-gradient(90deg,rgba(10,96,255,.35),rgba(255,0,127,.25));flex:none}
.gmbar .t{font-size:24px;line-height:1.3}
.gmbar .t b{display:block;font-size:28px}
.gmbar .cd{font-size:46px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
footer{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:auto;padding:0 0 36px;font-size:20px;color:var(--muted)}
footer img{height:28px}
.off{position:absolute;top:26px;right:36px;font-size:18px;color:var(--muted);display:none;z-index:4}
.off.show{display:block}
/* Grandmaster reveal */
.gm{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px;
  background:radial-gradient(80% 50% at 50% 38%,rgba(255,200,61,.28),transparent 70%),radial-gradient(120% 70% at 50% 0%,#14365f 0%,var(--midnight) 55%,var(--deep) 100%);opacity:0;pointer-events:none;transition:opacity 1s}
.gm.on{opacity:1}
.gm .lock{height:56px;margin-bottom:46px}
.gm .k{font-size:34px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.gm h2{margin:14px 0 0;font-size:96px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gm .crown{width:300px;height:220px;margin:56px 0 26px;filter:drop-shadow(0 18px 40px rgba(255,200,61,.45))}
.gm .who{font-size:104px;font-weight:700;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere;background:linear-gradient(180deg,#fff 30%,#ffe6a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.gm .who.many{font-size:76px}
.gm .pts{margin-top:22px;font-size:46px;font-weight:300;color:var(--gold)}
.gm .co{margin-top:12px;font-size:28px;color:var(--muted)}
.gm .rest{margin-top:70px;display:flex;gap:22px;justify-content:center;width:100%}
.gm .rest div{flex:1;max-width:440px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:22px}
.gm .rest b{display:block;font-size:24px;color:var(--muted);font-weight:600;letter-spacing:.08em}
.gm .rest em{display:block;font-style:normal;font-size:40px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm .rest span{font-size:26px;color:var(--muted)}
.gm .cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.gm>*:not(.cf):not(.foot){position:relative;z-index:1}
.gm .foot{z-index:1}
.gm .cf i{position:absolute;top:-40px;width:18px;height:28px;border-radius:3px;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(2000px) rotate(720deg)}}
.gm .foot{position:absolute;bottom:46px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;font-size:20px;color:var(--muted)}
.gm .foot img{height:28px}

.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 6px 14px}
.sh b{font-size:30px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cisco)}
.sh span{font-size:22px;color:var(--muted)}
.ovr{margin-top:22px;flex:none}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:16px;align-items:end}
.pod{border-radius:26px;padding:22px 16px 20px;text-align:center;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;min-width:0}
.pod::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--ribbon)}
.pod.p1{padding-top:30px;background:linear-gradient(180deg,rgba(255,200,61,.24),rgba(255,200,61,.05));border-color:rgba(255,200,61,.55)}
.pod .rk{font-size:26px;font-weight:700;letter-spacing:.06em}
.pod.p1 .rk{color:var(--gold);font-size:32px}.pod.p2 .rk{color:var(--silver)}.pod.p3 .rk{color:var(--bronze)}
.pod .nm{font-size:34px;font-weight:600;margin-top:10px;line-height:1.12;overflow-wrap:anywhere;min-height:2.24em;display:flex;align-items:center;justify-content:center}
.pod.p1 .nm{font-size:42px}
.pod .pt{font-size:60px;font-weight:300;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.pod.p1 .pt{font-size:78px}
.pod .pl{font-size:20px;color:var(--muted);margin-top:4px}
.pod.empty{opacity:.35}
.board{margin-top:24px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.board .rows{flex:1}
.champs{margin-top:20px;display:flex;gap:14px;flex:none}
.champs:empty{display:none}
.cday{flex:1}

/* tighter fit for Day 3, when two past days show */
header{padding:48px 0 6px}header img{height:46px}
h1{margin:16px 0 0;font-size:68px}
.subt{margin:8px 0 0;font-size:28px}
.ovr{margin-top:18px}.sh{margin:0 6px 10px}.sh b{font-size:28px}
.pod{padding:18px 14px 16px}.pod.p1{padding-top:24px}
.pod .nm{font-size:30px;margin-top:6px}.pod.p1 .nm{font-size:38px}
.pod .pt{font-size:54px;margin-top:4px}.pod.p1 .pt{font-size:70px}
.pod .pl{font-size:18px}
.board{margin-top:18px;overflow:hidden}
.row{height:76px;padding:0 24px}.rows{gap:8px}
.row .r{font-size:36px}.row .n{font-size:36px}.row .p{font-size:42px}
.champs{margin-top:16px}
.cday{padding:14px 16px 12px;gap:6px}.ch b{font-size:24px}.cl{font-size:21px}
.gmbar{margin-top:16px;padding:14px 24px}.gmbar .t{font-size:22px}.gmbar .t b{font-size:26px}.gmbar .cd{font-size:42px}
footer{padding:14px 0 30px}
</style>

<script>
(function(){
"use strict";
var API={url:"https://kagbjutxhptqurpkojsk.supabase.co",key:"sb_publishable_PLDKU1G5kmbT16iNcWMxsw_CNuy6_8b"},SWITCH=15000;
var $=function(id){return document.getElementById(id)},offset=0,lastOk=Date.now(),D=null,mode="today",prevPts={},first=true,gmOn=false;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);$("stage").style.transform="scale("+s+")"}
addEventListener("resize",fit);fit();
function dLabel(iso,opt){return new Date(iso+"T12:00:00").toLocaleDateString("en-AU",opt||{weekday:"long",day:"numeric",month:"long"})}

/* ---------- overall top 3 (podium) + today's top 10 ---------- */
function podHTML(p,slot){
  if(!p)return '<div class="pod p'+slot+' empty"><div class="rk">'+["","1ST","2ND","3RD"][slot]+'</div><div class="nm">Could be you</div><div class="pt">–</div><div class="pl">&nbsp;</div></div>';
  var k=Math.min(p.rank,3);
  return '<div class="pod p'+k+'"><div class="rk">'+["","1ST","2ND","3RD"][k]+'</div><div class="nm">'+esc(p.name)+'</div><div class="pt">'+p.points+'</div><div class="pl">points</div></div>';
}
function renderPodium(){
  var top=D.overall_top.filter(function(p){return p.rank<=3}).slice(0,3);
  /* on screen: 2nd, 1st, 3rd */
  $("podium").innerHTML=[top[1],top[0],top[2]].map(function(p,i){return podHTML(p,[2,1,3][i])}).join("");
}
function rowsHTML(list){
  if(!list.length)return '<div class="none">No games yet today.<br>Check in at the welcome desk to play!</div>';
  return list.map(function(p){var k="t:"+p.name,changed=!first&&prevPts[k]!==undefined&&prevPts[k]!==p.points;
    return '<div class="row'+(p.rank<=3?" m"+p.rank:"")+(changed?" new":"")+'"><div class="r">'+p.rank+'</div><div class="n">'+esc(p.name)+'</div><div class="p">'+p.points+'<small>pts</small></div></div>'}).join("");
}
function renderBoard(){
  $("rows").innerHTML=rowsHTML(D.today_top);
  $("todayT").textContent=D.day_no?"Day "+D.day_no+" · Top 10":"Today · Top 10";
  $("todayS").textContent="Resets at midnight";
}

/* ---------- daily champions ---------- */
var MED=["g","s","b"];
function renderChamps(){
  /* only finished days: on Day 1 nothing, on Day 2 Day 1, on Day 3 Days 1 and 2 */
  var done=D.days.filter(function(d){return d.done});
  $("champs").innerHTML=done.map(function(d){
    var podium=d.top.filter(function(p){return p.rank<=3}),shown=podium.slice(0,4),more=podium.length-shown.length;
    var body=d.top.length?shown.map(function(p){return '<div class="cl"><i class="'+(MED[p.rank-1]||"b")+'">'+p.rank+'</i><em>'+esc(p.name)+'</em><small>'+p.points+'</small></div>'}).join("")+(more>0?'<div class="cmore">+'+more+' more tied</div>':""):'<div class="csoon">No games</div>';
    return '<div class="cday done"><div class="ch"><b>Day '+d.n+' champions</b><span>'+dLabel(d.date,{weekday:"short",day:"numeric",month:"short"})+'</span></div>'+body+'</div>'}).join("");
}

/* ---------- Grandmaster countdown + reveal ---------- */
function pad(n){return String(n).padStart(2,"0")}
function tick(){
  if(!D)return;var ms=Date.parse(D.grandmaster.at)-(Date.now()+offset);
  if(ms<=0){$("gmCd").textContent="Now!";return}
  var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  $("gmCd").textContent=(d?d+"d ":"")+pad(h)+":"+pad(m)+":"+pad(sec);
}
setInterval(tick,1000);
function renderGm(){
  var g=D.grandmaster,at=new Date(g.at);
  $("gmWhen").textContent="crowned "+at.toLocaleDateString("en-AU",{timeZone:"Australia/Melbourne",weekday:"long",day:"numeric",month:"long"})+" · "+at.toLocaleTimeString("en-AU",{timeZone:"Australia/Melbourne",hour:"numeric",minute:"2-digit"}).replace(":00","").replace(" ","");
  var on=!!g.show&&g.top.length>0;
  if(on){
    var winners=g.top.filter(function(p){return p.rank===1}).slice(0,4),rest=winners.length>1?[]:g.top.filter(function(p){return p.rank>1&&p.rank<=3}).slice(0,3);
    $("gmTitle").textContent=winners.length>1?"Grandmasters":"Grandmaster";
    $("gmWho").textContent=winners.map(function(p){return p.name}).join(" & ");$("gmWho").classList.toggle("many",winners.length>1);
    $("gmPts").textContent=winners[0].points+" points";
    $("gmRest").innerHTML=rest.map(function(p){return '<div><b>'+(p.rank===2?"2ND":"3RD")+'</b><em>'+esc(p.name)+'</em><span>'+p.points+' pts</span></div>'}).join("");
  }
  if(on!==gmOn){gmOn=on;$("gm").classList.toggle("on",on);confetti(on)}
}
function confetti(on){
  var cf=$("cf");cf.innerHTML="";if(!on)return;var cols=["#ffc83d","#02c8ff","#ff007f","#0a60ff","#ff9000","#ffffff"],h="";
  for(var i=0;i<70;i++)h+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(5+Math.random()*6).toFixed(1)+'s;animation-delay:-'+(Math.random()*10).toFixed(1)+'s;transform:rotate('+Math.floor(Math.random()*360)+'deg)"></i>';
  cf.innerHTML=h;
}

/* ---------- data ---------- */
function render(d){
  D=d;offset=Date.parse(d.now)-Date.now();
  $("subt").innerHTML=d.day_no?'<b>Day '+d.day_no+'</b> · '+esc(dLabel(d.today)):esc(dLabel(d.today));
  $("closed").hidden=d.open;
  renderPodium();renderBoard();renderChamps();renderGm();tick();
  prevPts={};d.today_top.forEach(function(p){prevPts["t:"+p.name]=p.points});first=false;
}
function poll(){
  fetch(API.url+"/rest/v1/rpc/lb_board",{method:"POST",headers:{"apikey":API.key,"Content-Type":"application/json"},body:JSON.stringify({p_limit:10})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(d){lastOk=Date.now();render(d)},function(){})
    .then(function(){$("off").classList.toggle("show",Date.now()-lastOk>10000)});
}
poll();setInterval(poll,4000);
/* a screen left on for days: reload every 6 hours to stay fresh */
setTimeout(function(){location.reload()},6*3600*1000);
})();
</script>
